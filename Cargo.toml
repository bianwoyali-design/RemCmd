[workspace]
members = [
    "crates/remcmd-app",
    "crates/remcmd-core",
    "crates/remcmd-diagnostics",
    "crates/remcmd-local",
    "crates/remcmd-ssh",
    "crates/remcmd-storage",
    "crates/remcmd-terminal",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0-beta.1"
rust-version = "1.96"
repository = "https://github.com/bianwoyali-design/RemCmd"
description = "A GPU-accelerated SSH terminal and SFTP client"

[workspace.dependencies]
gpui = "0.2.2"
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"

alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "0.9.0"

secrecy = "0.10.3"
keyring = { version = "3.6.3", default-features = false }
base64 = "0.22.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
chrono = "0.4.45"
regex = "1.12.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

tokio = { version = "1.52.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
]}

tempfile = "3.27.0"

rand = "0.10.2"
glob = "0.3.3"
sha2 = "0.10.9"
wildmatch = "2.6.1"

russh = { version = "0.62.2", default-features = false, features = [
    "ring",
    "rsa",
]}
russh-sftp = "2.3.0"

remcmd-core = { path = "crates/remcmd-core"}
remcmd-diagnostics = { path = "crates/remcmd-diagnostics" }
remcmd-local = { path = "crates/remcmd-local" }
remcmd-ssh = { path = "crates/remcmd-ssh" }
remcmd-storage = { path = "crates/remcmd-storage" }
remcmd-terminal = { path = "crates/remcmd-terminal" }
