<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">RemCmd</title>
  <desc id="desc">A white command prompt with a mint cursor and a trailing echo, over signal rings on a blue aurora.</desc>
  <!-- Flat preview of macos/RemCmd.icon, which is the source for every rendered icon. -->
  <defs>
    <clipPath id="shape"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <g id="aurora">
<defs>
<linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="854" y2="1024">
<stop offset="0" stop-color="#3B8CFF"/><stop offset="0.42" stop-color="#0D55DC"/><stop offset="1" stop-color="#05163F"/>
</linearGradient>
<radialGradient id="violet" gradientUnits="userSpaceOnUse" cx="930" cy="110" r="600">
<stop offset="0" stop-color="#9A6BFF" stop-opacity="0.85"/><stop offset="1" stop-color="#9A6BFF" stop-opacity="0"/>
</radialGradient>
<radialGradient id="mint" gradientUnits="userSpaceOnUse" cx="130" cy="950" r="640">
<stop offset="0" stop-color="#2CE8C7" stop-opacity="0.8"/><stop offset="1" stop-color="#2CE8C7" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<rect width="1024" height="1024" fill="url(#violet)"/>
<rect width="1024" height="1024" fill="url(#mint)"/>
</g>
    <g id="signal-rings"><circle cx="588.3" cy="512.0" r="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5"/><circle cx="588.3" cy="512.0" r="390" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="5"/><circle cx="588.3" cy="512.0" r="530" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="5"/><circle cx="588.3" cy="512.0" r="670" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="5"/></g>
    <g id="echo"><path d="M227.39999999999998 331.6L474.79999999999995 512.0L227.39999999999998 692.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="100.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="prompt"><defs><linearGradient id="cur" gradientUnits="userSpaceOnUse" x1="636.6" y1="0" x2="796.6" y2="0"><stop offset="0" stop-color="#7DFBE0"/><stop offset="1" stop-color="#35E7C8"/></linearGradient></defs>
<path d="M340.9 331.6L588.3 512.0L340.9 692.4" fill="none" stroke="#FFFFFF" stroke-width="100.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M636.6 692.4H796.6" fill="none" stroke="url(#cur)" stroke-width="100.4" stroke-linecap="round"/></g>
  </g>
</svg>
