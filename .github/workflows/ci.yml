name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    rust:
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96.1
                  components: rustfmt, clippy

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Cargo check
              run: cargo check --workspace

            - name: Build app
              run: cargo build -p remcmd-app

    tests:
        name: Tests (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                    - name: Windows
                      os: windows-latest
                    - name: Ubuntu
                      os: ubuntu-22.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96.1
            - name: Restore Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  key: tests-${{ matrix.name }}
            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libegl1-mesa-dev \
                    libfontconfig1-dev \
                    libwayland-dev \
                    libx11-xcb-dev \
                    libxkbcommon-dev \
                    libxkbcommon-x11-dev \
                    libdbus-1-dev \
                    pkg-config
            - name: Run workspace tests
              run: cargo test --workspace
