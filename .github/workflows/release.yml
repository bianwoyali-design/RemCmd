name: Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing tag to publish as a release
                required: false
                type: string
    push:
        tags: ["v*"]

permissions:
    actions: read
    contents: write

jobs:
    package:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                      formats: dmg
                      artifact: remcmd-macos
                      path: target/release/*.dmg
                    - name: Windows
                      os: windows-latest
                      formats: wix
                      artifact: remcmd-windows
                      path: target/release/*.msi
                    - name: Linux
                      os: ubuntu-22.04
                      formats: deb,appimage
                      artifact: remcmd-linux
                      path: |
                          target/release/*.deb
                          target/release/*.AppImage

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96.1

            - name: Restore Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libegl1-mesa-dev \
                    libfontconfig1-dev \
                    libwayland-dev \
                    libx11-xcb-dev \
                    libxkbcommon-dev \
                    libxkbcommon-x11-dev \
                    libdbus-1-dev \
                    pkg-config

            - name: Install cargo-packager
              run: cargo install cargo-packager --locked --version 0.11.8

            - name: Build installation package
              if: runner.os != 'Windows'
              run: cargo packager --release -p remcmd-app --formats ${{ matrix.formats }}

            - name: Build Windows MSI
              if: runner.os == 'Windows'
              run: cargo packager --config packaging/wix/windows.toml --formats wix

            - name: Name Windows installer for the release
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = ((cargo pkgid -p remcmd-app) -split '#')[-1]
                  $installer = Get-ChildItem target/release -Filter '*.msi' | Select-Object -First 1
                  if ($null -eq $installer) {
                    throw 'cargo-packager did not produce an MSI.'
                  }
                  Rename-Item $installer.FullName "RemCmd-v$version-windows-x86_64.msi"

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error
                  retention-days: 14

    release:
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        needs: package
        runs-on: ubuntu-latest

        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
              run: |
                  set -euo pipefail
                  args=(release create "$RELEASE_TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes)
                  if [[ "$RELEASE_TAG" == *-* ]]; then
                    args+=(--prerelease)
                  fi
                  gh "${args[@]}"
