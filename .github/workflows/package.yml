name: Package

on:
    workflow_dispatch:
    pull_request:
        paths:
            - ".github/workflows/package.yml"
            - "Cargo.toml"
            - "Cargo.lock"
            - "crates/**"
            - "assets/icons/**"
    push:
        branches: [main]
        paths:
            - ".github/workflows/package.yml"
            - "Cargo.toml"
            - "Cargo.lock"
            - "crates/**"
            - "assets/icons/**"

jobs:
    package:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                      formats: dmg
                      artifact: remcmd-macos
                      path: target/release/*.dmg
                    - name: Windows
                      os: windows-latest
                      formats: nsis
                      artifact: remcmd-windows
                      path: target/release/*-setup.exe
                    - name: Linux
                      os: ubuntu-22.04
                      formats: deb,appimage
                      artifact: remcmd-linux
                      path: |
                          target/release/*.deb
                          target/release/*.AppImage

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96.1

            - name: Restore Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libegl1-mesa-dev \
                    libfontconfig1-dev \
                    libwayland-dev \
                    libx11-xcb-dev \
                    libxkbcommon-dev \
                    libdbus-1-dev \
                    pkg-config

            - name: Install cargo-packager
              run: cargo install cargo-packager --locked --version 0.11.8

            - name: Build installation package
              run: cargo packager --release -p remcmd-app --formats ${{ matrix.formats }}

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error
                  retention-days: 14
