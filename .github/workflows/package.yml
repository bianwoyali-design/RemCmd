name: Package

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    actions: read
    contents: read

jobs:
    package:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-latest
                      formats: dmg
                      artifact: remcmd-macos
                      path: target/release/*.dmg
                    - name: Windows
                      os: windows-latest
                      formats: wix
                      artifact: remcmd-windows
                      path: target/release/*.msi
                    - name: Linux
                      os: ubuntu-22.04
                      formats: deb,appimage
                      artifact: remcmd-linux
                      path: |
                          target/release/*.deb
                          target/release/*.AppImage

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96.1

            - name: Restore Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libegl1-mesa-dev \
                    libfontconfig1-dev \
                    libwayland-dev \
                    libx11-xcb-dev \
                    libxkbcommon-dev \
                    libxkbcommon-x11-dev \
                    libdbus-1-dev \
                    pkg-config

            - name: Install cargo-packager
              run: cargo install cargo-packager --locked --version 0.11.8

            - name: Build installation package
              if: runner.os != 'Windows'
              run: cargo packager --release -p remcmd-app --formats ${{ matrix.formats }}

            - name: Build Windows MSI
              if: runner.os == 'Windows'
              run: cargo packager --config packaging/wix/Packager.toml --formats wix

            - name: Verify SignPath release configuration
              if: matrix.name == 'Windows' && startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
                  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
                  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
                  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
              run: |
                  for variable in \
                    SIGNPATH_API_TOKEN \
                    SIGNPATH_ORGANIZATION_ID \
                    SIGNPATH_PROJECT_SLUG \
                    SIGNPATH_SIGNING_POLICY_SLUG \
                    SIGNPATH_ARTIFACT_CONFIGURATION_SLUG; do
                    if [ -z "${!variable}" ]; then
                      echo "Missing required SignPath configuration: ${variable}" >&2
                      exit 1
                    fi
                  done

            - name: Upload unsigned Windows package for SignPath
              if: matrix.name == 'Windows' && startsWith(github.ref, 'refs/tags/v')
              id: upload-unsigned-windows-package
              uses: actions/upload-artifact@v4
              with:
                  name: remcmd-windows-unsigned
                  path: target/release/*.msi
                  if-no-files-found: error
                  retention-days: 1

            - name: Sign Windows package with SignPath
              if: matrix.name == 'Windows' && startsWith(github.ref, 'refs/tags/v')
              uses: signpath/github-action-submit-signing-request@v2
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
                  signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
                  artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
                  github-artifact-id: ${{ steps.upload-unsigned-windows-package.outputs.artifact-id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  wait-for-completion: true
                  output-artifact-directory: target/release/signed

            - name: Upload package artifact
              if: matrix.name != 'Windows' || !startsWith(github.ref, 'refs/tags/v')
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload signed Windows package artifact
              if: matrix.name == 'Windows' && startsWith(github.ref, 'refs/tags/v')
              uses: actions/upload-artifact@v4
              with:
                  name: remcmd-windows
                  path: target/release/signed/**/*.msi
                  if-no-files-found: error
                  retention-days: 14
