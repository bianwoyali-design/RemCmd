[package]
name = "remcmd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[package.metadata.packager]
product-name = "RemCmd"
identifier = "io.github.bianwoyali-design.remcmd"
category = "DeveloperTool"
formats = ["app"]
before-packaging-command = "cargo build --release -p remcmd-app"
license-file = "../../LICENSE"
icons = [
    "../../assets/icons/remcmd.icns",
    "../../assets/icons/remcmd.ico",
    "../../assets/icons/remcmd-*.png",
]

[package.metadata.packager.macos]
# Ad-hoc signing makes the packaged bundle internally consistent for alpha
# installs. It is intentionally not a substitute for Developer ID notarization.
signing-identity = "-"
minimum-system-version = "13.0"

[[bin]]
name = "remcmd"
path = "src/main.rs"

[dependencies]
directories.workspace = true
gpui.workspace = true
remcmd-core.workspace = true
remcmd-local.workspace = true
remcmd-ssh.workspace = true
remcmd-storage.workspace = true
remcmd-terminal.workspace = true
secrecy.workspace = true
tokio.workspace = true
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSColor",
    "NSImage",
    "NSImageRep",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSURL",
] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"
